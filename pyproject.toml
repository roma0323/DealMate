[project]
name = "dealmate"
version = "0.1.0"
description = "DealMate: a second-hand trading agent as an MCP server"
authors = [
    { name = "roma_0323", email = "r911223oger@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
dealmate = "dealmate:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
